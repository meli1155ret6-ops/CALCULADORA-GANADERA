<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Ganadera Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen" class="screen">
        <div class="card login-card">
            <h1>🐄 Calculadora Ganadera Pro</h1>
            <p>Inicia sesión o regístrate</p>

            <input type="text" id="username" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">

            <div class="buttons">
                <button onclick="login()">Ingresar</button>
                <button onclick="register()">Registrarse</button>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div id="main-screen" class="screen hidden">

        <div class="header">
            <h1>🐄 Calculadora Ganadera</h1>
            <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
        </div>

        <div class="card">
            <h2>Selecciona un animal</h2>

            <div class="animal-buttons">
                <button onclick="seleccionarAnimal('cerdo')">🐖 Cerdo</button>
                <button onclick="seleccionarAnimal('vaca')">🐄 Vaca</button>
                <button onclick="seleccionarAnimal('gallina')">🐔 Gallina</button>
                <button onclick="seleccionarAnimal('caballo')">🐎 Caballo</button>
                <button onclick="seleccionarAnimal('oveja')">🐑 Oveja</button>
            </div>
        </div>

        <!-- FORMULARIO -->
        <div id="form-animal" class="card hidden">
            <h2 id="animal-titulo"></h2>

            <div class="form-grid">
                <input type="number" id="cantidad" placeholder="Cantidad de animales">

                <input type="number" id="peso"
                    placeholder="Peso promedio (kg)">

                <input type="number" id="precio"
                    placeholder="Precio por kilo/unidad">

                <input type="number" id="gastos"
                    placeholder="Gastos mensuales por animal">

                <input type="number" id="alimento"
                    placeholder="Alimento diario (kg)">

                <input type="number" id="hectareas"
                    placeholder="Cantidad de hectáreas">
            </div>

            <button class="calcular-btn" onclick="calcular()">
                Calcular
            </button>
        </div>

        <!-- RESULTADOS -->
        <div id="resultado" class="card resultado hidden"></div>

        <!-- HISTORIAL -->
        <div class="card historial">
            <h2>📋 Historial de cálculos</h2>
            <div id="historial-lista"></div>
        </div>

        <!-- WHATSAPP -->
        <a href="https://wa.me/573001112233" target="_blank">
            <button id="contacto">
                WhatsApp
            </button>
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
